<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
  </head>
  <body>
    <app-bar></app-bar>

    <main>
      <note-input></note-input>

      <div id="loadingIndicator" class="loader-container" hidden>
        <div class="loader-status">
          <span class="loader-dot"></span>
          <span class="loader-text">LOADING NOTES</span>
        </div>

        <div class="loader-track">
          <div class="loader-progress"></div>
        </div>

        <span class="loader-caption">SYNCING WITH SERVER...</span>
      </div>

      <div id="errorMessage" class="error-message" hidden></div>

      <h2>Daftar Catatan</h2>
      <div
        id="notesContainer"
        class="notes-container"
        style="margin-top: 15px"
      ></div>
    </main>

    <section class="archived-section">
      <h2>Catatan Diarsipkan</h2>
      <div id="archivedNotesContainer" class="notes-container"></div>
    </section>

    <app-footer></app-footer>
  </body>
</html>
